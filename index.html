<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Diagnóstico Estratégico Digital</title>
<meta name="description" content="Descubra o que está limitando o crescimento da sua empresa no digital. Diagnóstico estratégico personalizado em poucos minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fixed diagnostic frame chrome -->
  <div class="frame">
    <header class="frame-header" id="frameHeader">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Diagnóstico Estratégico</span>
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-label" id="progressLabel">Etapa 1</span>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="step" id="app-content"></div>
    </main>

    <footer class="frame-footer">
      <button class="btn-back" id="btnBack" hidden aria-label="Voltar">← Voltar</button>
      <span class="footer-note">Suas respostas ficam salvas neste dispositivo enquanto você responde.</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
