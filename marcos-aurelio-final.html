<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcos Aurélio — Diagnóstico & Estratégia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --surface:#141416; --surface-2:#1C1D20; --border:#2A2B2E;
    --text:#F4F3EF; --muted:#8C8D91; --gold:#C9A15A; --teal:#4E9C82; --rust:#C1622D;
  }
  
  /* ===== PALETAS POR STAGE (Jornada Emocional) ===== */
  
  /* STAGE 0: Abertura - Profissional, Confiança */
  [data-stage="0"]{
    --bg:#0D1419;
    --surface:#151A21;
  }
  
  /* STAGE 1: Diagnóstico - Análise Profunda */
  [data-stage="1"]{
    --bg:#0A131A;
    --surface:#12191F;
  }
  
  /* STAGE 3: Serviços */
  [data-stage="3"]{
    --bg:#0A0F14;
    --surface:#12161C;
  }
  
  /* Impacto Visual - Laranja/Quente (PICO) */
  .slide:nth-child(15) {
    --bg:#1A0F0A;
    --surface:#22140D;
  }
  
  /* Planos - Verde */
  .slide:nth-child(16) {
    --bg:#0A1410;
    --surface:#101A16;
  }
  
  /* ROI - Verde Tranquilo */
  .slide:nth-child(17) {
    --bg:#0A1410;
    --surface:#0F1814;
  }
  
  /* Fechamento - Gold */
  .slide:nth-child(18), .slide:nth-child(19) {
    --bg:#14120A;
    --surface:#1A1610;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);}
  body{font-family:'Work Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--gold);color:#0A0A0B;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;}

  .rail{display:flex;gap:6px;padding:14px 20px 0;flex-shrink:0;}
  .rail-seg{flex:1;position:relative;}
  .rail-seg .track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
  .rail-seg .fill{height:100%;width:0%;background:var(--gold);transition:width .5s cubic-bezier(.4,0,.2,1);}
  .rail-seg .label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:7px;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rail-seg.active .label{color:var(--gold);}
  .rail-seg.done .fill{width:100%;}

  .viewport{flex:1;position:relative;overflow:hidden;}
  .slide{position:absolute;inset:0;padding:40px 7vw 24px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .4s ease, transform .4s ease;overflow-y:auto;}
  .slide.active{opacity:1;pointer-events:auto;transform:translateY(0);}
  .inner{max-width:1180px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
  .big{font-weight:800;line-height:1.03;letter-spacing:-0.02em;margin:0;}

  .nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 7vw 18px;}
  .nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .2s, border-color .2s;flex-shrink:0;}
  .nav-btn:hover{background:var(--surface-2);border-color:var(--gold);}
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:50vw;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer;transition:background .2s, transform .2s;}
  .dot.active{background:var(--gold);transform:scale(1.6);}
  .slide-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0;}

  .cover{justify-content:center;}
  .cover .mark{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:24px;}
  .cover h1{font-size:clamp(36px,6.5vw,76px);}
  .cover h1 em{font-style:normal;color:var(--gold);}
  .cover .sub{font-size:17.5px;color:var(--muted);max-width:600px;margin-top:20px;line-height:1.5;}
  .cover .sub strong{color:var(--text);}

  .divider{justify-content:center;align-items:center;text-align:center;}
  .divider .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px;}
  .divider h2{font-size:clamp(38px,7vw,84px);}
  .divider .sub2{color:var(--muted);font-size:16px;max-width:520px;margin:18px auto 0;}

  h2.title{font-size:clamp(26px,3.6vw,44px);margin:0 0 8px;}
  p.lede{font-size:16px;color:var(--muted);max-width:680px;line-height:1.6;margin:0 0 6px;}

  /* proof / mockup */
  .proof-grid{display:grid;grid-template-columns:220px 220px 1fr;gap:28px;margin-top:28px;align-items:start;}
  @media(max-width:860px){.proof-grid{grid-template-columns:1fr 1fr;} .proof-list{grid-column:1/-1;}}
  @media(max-width:600px){.proof-grid{grid-template-columns:1fr;}}
  .phone-mock{border:6px solid #222;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .phone-mock img{display:block;width:100%;height:auto;}
  .phone-cap{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:.04em;}
  .proof-list{display:flex;flex-direction:column;gap:12px;}
  .proof-item{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--text);}
  .proof-item .ck{color:var(--teal);flex-shrink:0;}

  .valor-entregue{margin-top:24px;border:1px solid var(--gold);border-radius:14px;padding:20px 24px;background:linear-gradient(180deg, rgba(201,161,90,0.07), var(--surface));}
  .ve-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .ve-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-top:1px solid var(--border);color:var(--text);}
  .ve-row:first-of-type{border-top:none;}
  .ve-total{display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:19px;padding:12px 0 4px;margin-top:4px;border-top:1.5px solid var(--gold);color:var(--gold);}
  .ve-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:10px;}

  /* live fields */
  .live-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px;}
  .live-card{border:1px solid var(--border);border-radius:14px;padding:20px 22px;background:var(--surface);}
  .live-card.emph{border-color:var(--gold);background:linear-gradient(180deg, rgba(201,161,90,0.06), var(--surface));}
  .live-card label{display:block;font-size:15px;color:var(--text);margin-bottom:4px;font-weight:600;}
  .live-card .w{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:block;}
  textarea.livefield{width:100%;min-height:56px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Work Sans',sans-serif;font-size:14px;padding:11px 13px;resize:vertical;outline:none;transition:border-color .2s;}
  textarea.livefield:focus{border-color:var(--gold);}

  /* compare */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;}
  @media(max-width:760px){.compare-grid{grid-template-columns:1fr;}}
  .compare-card{border-radius:16px;padding:24px 24px;border:1.5px solid var(--border);background:var(--surface);}
  .compare-card.bad{border-color:rgba(193,98,45,0.5);}
  .compare-card.good{border-color:rgba(78,156,130,0.55);background:linear-gradient(180deg, rgba(78,156,130,0.07), var(--surface));}
  .compare-card .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:inline-block;}
  .compare-card.bad .tag{color:var(--rust);}
  .compare-card.good .tag{color:var(--teal);}
  .compare-card p{font-size:16px;line-height:1.5;margin:0;color:var(--text);}

  /* echo cards (diagnóstico dinâmico) */
  .echo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;}
  @media(max-width:760px){.echo-grid{grid-template-columns:1fr;}}
  .echo-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--surface);}
  .echo-card.empty{border-style:dashed;opacity:0.6;}
  .echo-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .echo-val{font-size:14.5px;color:var(--text);line-height:1.45;}
  .echo-card.empty .echo-val{color:var(--muted);font-style:italic;}

  /* stats */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px;}
  @media(max-width:760px){.stats-grid{grid-template-columns:1fr;}}
  .stat-col{border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--surface);}
  .stat-col .col-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
  .stat-row{padding:12px 0;border-top:1px solid var(--border);}
  .stat-row:first-of-type{border-top:none;}
  .stat-num{font-family:'Fraunces',serif;font-size:22px;color:var(--text);}
  .stat-col.meta .stat-num{color:var(--gold);}
  .stat-sub{font-size:13px;color:var(--muted);margin-top:2px;}

  .resultado{text-align:center;justify-content:center;align-items:center;}
  .period{display:inline-block;margin-top:22px;padding:9px 20px;border:1px solid var(--gold);border-radius:99px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--gold);letter-spacing:.06em;}

  .quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;}
  @media(max-width:760px){.quad-grid{grid-template-columns:1fr;}}
  .quad-item{border:1px solid var(--border);border-radius:16px;padding:22px;background:var(--surface);}
  .quad-item .n{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:11px;margin-bottom:8px;}
  .quad-item h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px;font-weight:600;}
  .quad-item p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5;}

  .funil-list{margin-top:24px;display:flex;flex-direction:column;}
  .funil-row{display:grid;grid-template-columns:70px 180px 1fr;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--border);}
  .funil-row:first-child{border-top:none;}
  @media(max-width:700px){.funil-row{grid-template-columns:1fr;gap:4px;}}
  .funil-qty{font-family:'Fraunces',serif;font-size:24px;color:var(--gold);}
  .funil-name{font-size:16px;font-weight:600;}
  .funil-desc{font-size:13.5px;color:var(--muted);}

  .bench-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;}
  @media(max-width:760px){.bench-grid{grid-template-columns:1fr;}}
  .bench-card{border:1px solid var(--border);border-radius:16px;padding:22px;background:var(--surface);}
  .bench-card h3{font-family:'Fraunces',serif;font-weight:600;font-size:17.5px;margin:0 0 8px;color:var(--gold);}
  .bench-card p{font-size:13.5px;color:var(--muted);margin:0 0 6px;line-height:1.6;}
  .bench-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:10px;}

  .ref-grid{display:grid;grid-template-columns:180px 1fr;gap:26px;margin-top:24px;align-items:start;}
  @media(max-width:700px){.ref-grid{grid-template-columns:1fr;}}
  .ref-stats{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .ref-stat{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding:10px 0;font-size:14px;}
  .ref-stat:first-child{border-top:none;}
  .ref-stat b{color:var(--gold);}

  .deliver-list{margin-top:22px;display:flex;flex-direction:column;}
  .deliver-row{display:grid;grid-template-columns:70px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--border);align-items:baseline;}
  .deliver-row:first-child{border-top:none;}
  @media(max-width:700px){.deliver-row{grid-template-columns:1fr;gap:2px;}}
  .deliver-num{font-family:'Fraunces',serif;font-size:21px;color:var(--gold);}
  .deliver-title{font-size:15px;font-weight:600;margin-bottom:2px;}
  .deliver-desc{font-size:13px;color:var(--muted);}

  /* task list (category detail) */
  .task-cols{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px;}
  .task-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;}
  .task-item .idx{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:11px;flex-shrink:0;width:22px;}

  /* workflow */
  .wf-phase{margin-top:22px;}
  .wf-phase .ph-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .wf-row{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px;}
  .wf-row:first-child{border-top:none;}
  .wf-day{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px;}

  /* pricing table */
  .price-table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px;}
  .price-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px 10px;border-bottom:1px solid var(--border);}
  .price-table td{padding:12px 14px;border-bottom:1px solid var(--border);}
  .price-table td.market{color:var(--muted);text-decoration:line-through;}
  .price-table td.mine{color:var(--gold);font-weight:600;font-family:'Fraunces',serif;font-size:15px;}
  .price-table td.mid{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .price-table td.src{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:center;}
  .price-note{font-size:11.5px;color:var(--muted);margin-top:12px;font-style:italic;}

  /* plan cards */
  .plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px;}
  @media(max-width:900px){.plans-grid{grid-template-columns:1fr;}}
  .plan-card{border:1.5px solid var(--border);border-radius:16px;padding:22px;background:var(--surface);display:flex;flex-direction:column;}
  .plan-card.highlight{border-color:var(--gold);background:linear-gradient(180deg, rgba(201,161,90,0.08), var(--surface));}
  .plan-card .pname{font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px;}
  .plan-card .pprice{font-family:'Fraunces',serif;font-size:28px;color:var(--gold);margin:6px 0 2px;}
  .plan-card .pterm{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
  .economia-tag{display:inline-block;font-family:'Fraunces',serif;font-size:16px;color:var(--teal);background:rgba(78,156,130,0.12);border:1px solid var(--teal);border-radius:8px;padding:6px 12px;margin-bottom:12px;}
  .plan-card .pmarket{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.4;}
  .plan-card .pmarket s{color:var(--muted);}
  .plan-card ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;flex:1;}
  .plan-card li{font-size:13px;color:var(--text);padding-left:16px;position:relative;}
  .plan-card li::before{content:"—";position:absolute;left:0;color:var(--gold);}

  /* page tiers */
  .tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;}
  @media(max-width:800px){.tier-grid{grid-template-columns:1fr;}}
  .tier-card{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--surface);}
  .tier-card h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 8px;color:var(--gold);}
  .tier-card p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}

  /* payment */
  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;}
  @media(max-width:760px){.pay-grid{grid-template-columns:1fr;}}
  .pay-card{border:1px solid var(--border);border-radius:14px;padding:20px 22px;background:var(--surface);}
  .pay-card h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 10px;}
  .pay-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--border);}
  .pay-row:first-child{border-top:none;}
  .pay-row b{color:var(--gold);}
  .discount-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:10px;}

  .bonus-line{margin-top:20px;padding:16px 18px;border-radius:10px;background:rgba(201,161,90,0.12);border:1px solid var(--gold);font-size:14px;}
  .bonus-line strong{color:var(--gold);}

  .fontes-list{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
  .fonte-item{display:grid;grid-template-columns:32px 1fr;gap:14px;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  .fonte-n{font-family:'Fraunces',serif;font-size:18px;color:var(--gold);}
  .fonte-t{font-size:14.5px;font-weight:600;margin-bottom:4px;}
  .fonte-d{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.5;}
  .fonte-f{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .fonte-f a{color:var(--teal);text-decoration:underline;text-underline-offset:3px;word-break:break-all;cursor:pointer;}
  .fonte-f a:hover{color:var(--gold);}

  .agenda{text-align:center;justify-content:center;align-items:center;}
  .agenda .neg{color:var(--muted);font-size:14.5px;max-width:560px;margin:22px auto 0;line-height:1.6;}
  .agenda .sign{margin-top:30px;color:var(--muted);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}

  @media(max-width:700px){
    .slide{padding:32px 6vw 20px;}
    .nav{padding:10px 6vw 16px;}
    .rail{padding:10px 6vw 0;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="rail" id="rail"></div>
  <div class="viewport" id="viewport"></div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="dots" id="dots"></div>
    <span class="slide-count mono" id="count"></span>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
</div>

function slideDivider(word, sub, n){
  return `

function liveCard(label, help, id, emph){
  return `<div class="live-card ${emph?'emph':''}"><label>${label}</label><span class="w">${help}</span><textarea class="livefield" id="${id}" placeholder="Anote aqui, durante a conversa..."></textarea></div>`;
}

function fv(id){
  const el = document.getElementById(id);
  const v = el ? el.value.trim() : '';
  return v.length ? v : null;
}
const ECHO_FIELDS = [
  {id:'f_areas', label:'Área de atuação'},
  {id:'f_diferencial', label:'Diferencial dele'},
  {id:'f_cliente_quem', label:'Cliente ideal'},
  {id:'f_cliente_decisao', label:'Como ele decide contratar'},
  {id:'f_cliente_ouvir', label:'O que precisa ouvir antes de confiar'},
  {id:'f_cliente_onde', label:'Onde ele busca ajuda hoje'},
  {id:'f_motivo', label:'O que motivou procurar isso agora'},
  {id:'f_servicos_percebidos', label:'Serviços que ele acha que precisa'},
];

function slideDiagPersonalizado(){
  return `
  <div class="inner">
    <div class="eyebrow">Diagnóstico · Baseado no que você me contou</div>
    <h2 class="title">O retrato do seu escritório, com as suas palavras.</h2>
    <p class="lede">Isto vem direto das respostas da etapa anterior — se algo ainda estiver em branco, é porque ainda não conversamos sobre aquele ponto.</p>
    <div class="echo-grid" id="echo-grid"></div>
  </div>`;
}

function renderDynamicDiagnosis(){
  const echoEl = document.getElementById('echo-grid');
  if(echoEl){
    echoEl.innerHTML = ECHO_FIELDS.map(f=>{
      const v = fv(f.id);
      return `<div class="echo-card ${v?'':'empty'}"><div class="echo-label">${f.label}</div><div class="echo-val">${v ? v.replace(/</g,'&lt;') : '(ainda não conversamos sobre isso)'}</div></div>`;
    }).join('');
  }
}

/* ============================= SLIDES ============================= */
const slides = [
  {stage:0, render: slideCover},
  {stage:0, render: slideProof},
  {stage:0, render: ()=>slideDivider('Vamos te ouvir primeiro', 'As próximas telas são pra mim anotar, ao vivo, o que você me contar.', 1)},
  {stage:0, render: slideListenNegocio},
  {stage:0, render: slideListenMotivacao},

  {stage:1, render: ()=>slideDivider('Diagnóstico', null, 2)},
  {stage:1, render: slideDiagPersonalizado},
  {stage:1, render: slideEstrategiaEmTres},

  {stage:3, render: ()=>slideDivider('Serviços', null, 3)},
  {stage:3, render: slideOQueVoceEntrega},
  {stage:3, render: slideGoogleAds},
  {stage:3, render: slideProjection},
  {stage:3, render: slideImpactoNumeros},
  {stage:3, render: ()=>slideDivider('Investimento', null, 4)},
  {stage:3, render: slidePlans},
  {stage:3, render: slideRoiInvestimento},
  {stage:3, render: slidePayment},
  {stage:3, render: slideAgenda},
];

/* ============================= ENGINE ============================= */
const state = { slide: 0 };
const viewport = document.getElementById('viewport');
const railEl = document.getElementById('rail');
const dotsEl = document.getElementById('dots');
const countEl = document.getElementById('count');

function buildRail(){
  railEl.innerHTML = STAGE_LABELS.map((label,i)=>`
    <div class="rail-seg" data-stage="${i}">
      <div class="track"><div class="fill"></div></div>
      <div class="label">${label}</div>
    </div>`).join('');
}
function buildDots(){
  dotsEl.innerHTML = slides.map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(d=>d.addEventListener('click', ()=>goTo(+d.dataset.i)));
}
function renderAll(){
  viewport.innerHTML = slides.map((s,i)=>`<section class="slide" data-i="${i}" data-stage="${s.stage}">${s.render()}</section>`).join('');
}
function updateChrome(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===state.slide));
  document.querySelectorAll('.dot').forEach((el,i)=> el.classList.toggle('active', i===state.slide));
  countEl.textContent = (state.slide+1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = state.slide===0;
  document.getElementById('nextBtn').disabled = state.slide===slides.length-1;

  const curStage = slides[state.slide].stage;
  document.querySelectorAll('.rail-seg').forEach((seg,i)=>{
    seg.classList.toggle('active', i===curStage);
    seg.classList.toggle('done', i<curStage);
    const fill = seg.querySelector('.fill');
    if(i<curStage) fill.style.width='100%';
    else if(i===curStage){
      const stageSlides = slides.map((s,idx)=>({s,idx})).filter(x=>x.s.stage===i);
      const firstIdx = stageSlides[0].idx;
      const lastIdx = stageSlides[stageSlides.length-1].idx;
      const pct = ((state.slide-firstIdx)/(Math.max(1,lastIdx-firstIdx)))*100;
      fill.style.width = pct+'%';
    } else fill.style.width='0%';
  });
}
function goTo(i){
  state.slide = Math.max(0, Math.min(slides.length-1, i));
  updateChrome();
}

buildRail();
buildDots();
renderAll();
updateChrome();
renderDynamicDiagnosis();

ECHO_FIELDS.forEach(f=>{
  const el = document.getElementById(f.id);
  if(el) el.addEventListener('input', renderDynamicDiagnosis);
});

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(state.slide-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(state.slide+1));
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(e.key==='ArrowRight') goTo(state.slide+1);
  if(e.key==='ArrowLeft') goTo(state.slide-1);
});
let touchX=null;
viewport.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
viewport.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>60){ dx<0 ? goTo(state.slide+1) : goTo(state.slide-1); }
  touchX=null;
});
</script>
